[package]
name = "chymeral"
version = "1.7.0"
edition = "2024"
rust-version = "1.90"
description = "Minimal terminal emulator with a local CLP graphics runtime"
repository = "https://github.com/Chymeral/chymeral"
license = "MIT"
publish = false
keywords = ["terminal", "graphics", "clp", "pty", "wgpu"]
categories = ["command-line-utilities", "gui"]

[dependencies]
anyhow = "1.0"
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
glyphon = "0.12"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
interprocess = "2.4"
pollster = "0.4"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
unicode-width = "0.2"
vte = "0.15"
wgpu = "30.0"
winit = "0.30.13"

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging"] }
