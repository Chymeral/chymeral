[package]
name = "chymeral"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arboard = { version = "3.4", default-features = false, features = ["wayland-data-control"] }
glyphon = "0.12"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
interprocess = "2.4"
pollster = "0.4"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
unicode-width = "0.2"
vte = "0.15"
wgpu = "30.0"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }
